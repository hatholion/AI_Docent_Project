experiment:
  name: recursive_500_overlap50_bge_m3
chunking:
  strategy: recursive
  chunk_size: 500
  chunk_overlap: 50
embedding:
  model_name: BAAI/bge-m3
llm:
  enabled: true
  provider: transformers
  source: huggingface  # 저장 후 local로 변경
  model: Qwen/Qwen3-1.7B  # local이면 ai/llm/model/ 아래 저장된 모델 폴더 경로
  quantization: nf4  # nf4, int4, int8, fp8, bf16, fp16, none / local: 저장된 설정 사용
  save_dir: "ai/llm/model/qwen3-1.7b-{nf4}"  # 방식별로 다른 폴더에 저장
  device: cuda:0
  compute_dtype: auto
  trust_remote_code: false
  max_input_tokens: 4096
  max_new_tokens: 512
  enable_thinking: false
  visitor_type: test
  temperature: 0.0
rag:
  relic_label: "본관 2789"
evaluation:
  dataset: ai/llm/evaluation/evalset/eval_dataset_exp01.json
