data:
  gold_file: data/gold/Gold_0928.jsonl
rag:
  relic_label: "본관 2789"
  smoke_query: null  # 검색 동작 확인이 필요할 때만 실제 질문을 지정
experiment:
  name: base
chunking:
  strategy: recursive
  chunk_size: 800
  chunk_overlap: 120
embedding:
  model_name: BAAI/bge-m3
  device: auto
  normalize_embeddings: true
  query_prefix: ""
  document_prefix: ""
vectorstore:
  type: chroma
  base_dir: ai/rag/storage/experiments
  collection_name: gold_artifacts
retriever:
  search_type: similarity
  k: 5
  fetch_k: 20
  lambda_mult: 0.5
evaluation:
  dataset: ai/llm/evaluation/evalset/eval_dataset_exp01.json
  metrics: [chunk_recall_at_1, chunk_recall_at_3, chunk_recall_at_5]
llm:
  enabled: false
  provider: ollama
  # Ollama에 준비된 모델 태그로 양자화를 선택합니다. 8비트 예: qwen3:8b-q8_0
  model: qwen3:8b-q4_K_M
  visitor_type: general
  temperature: 0.0
  # provider: transformers일 때 사용. model은 HF ID 또는 로컬 폴더로 지정합니다.
  source: huggingface
  quantization: nf4  # nf4, int4, int8, fp8, bf16, fp16, none
  device: cuda:0
  compute_dtype: auto
  trust_remote_code: false
  max_input_tokens: 4096
  max_new_tokens: 512
  enable_thinking: false
