[project]
name = "gg-minipjt-2"
version = "0.1.0"
description = "국립중앙박물관 AI 도슨트 프로젝트"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3,<3",
    "torchvision>=0.18,<1",
    "pillow>=10,<13",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "tqdm>=4.66,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
cpu = ["torch", "torchvision"]
cu130 = ["torch", "torchvision"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu130" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
